<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>« MehdiNeox Ω info »</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --muted: #9a9a9a;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--fg);
    font-family: "Vazirmatn", Tahoma, sans-serif;
    line-height: 1.9;
    text-align: center;
  }

  main {
    width: 100%;
    max-width: 420px;
  }

  /* Avatar */
  .avatar-wrap {
    position: relative;
    width: 132px;
    height: 132px;
    margin: 0 auto 28px;
  }

  .avatar {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 50%;
    object-fit: cover;
    background: var(--bg);
  }

  .avatar-wrap::before {
    content: "";
    position: absolute;
    inset: -10px;
    border: 2px dashed var(--fg);
    border-radius: 50%;
    animation: spin 18s linear infinite;
  }
  
  /* Text */
  h1 {
    margin-bottom: 8px;
    font-size: 1.7rem;
    font-weight: 900;
  }

  .wave {
    display: inline-block;
    transform-origin: 70% 70%;
    animation: wave 2.6s ease-in-out infinite;
  }

  .bio {
    margin-bottom: 32px;
    color: var(--muted);
  }

  /* Links */
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .links a {
    display: block;
    padding: 12px 20px;
    border: 1.5px solid var(--fg);
    border-radius: 999px;
    color: var(--fg);
    font-weight: 700;
    text-decoration: none;
    transition: background .2s, color .2s, transform .2s;
  }

  .links a:hover,
  .links a:focus-visible {
    background: var(--fg);
    color: var(--bg);
    transform: translateY(-2px);
    outline: none;
  }

  .links a:active {
    transform: translateY(0);
  }

  /* Animations */
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @keyframes wave {
    0%, 60%, 100% { transform: rotate(0); }
    10%, 30% { transform: rotate(14deg); }
    20%, 40% { transform: rotate(-8deg); }
    50% { transform: rotate(10deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .avatar-wrap::before,
    .wave { animation: none; }
    .links a { transition: none; }
  }
</style>
</head>
<body>
  <main>
    <div class="avatar-wrap">
      <img class="avatar" src="images/avatar.gif" alt="مهدی‌نئوکس">
    </div>

    <h1>سلام، من مهدی‌نئوکس هستم <span class="wave">👋</span></h1>

    <p class="bio">
      برنامه‌نویس وب تازه‌کار که عاشق ساختن چیزهای ساده و کاربردیه.
      با HTML، CSS و JavaScript پروژه می‌سازم و هر روز یه چیز جدید یاد می‌گیرم.
    </p>

    <nav class="links">
      <a href="https://t.me/MehdiNeox" target="_blank" rel="noopener">تلگرام من</a>
      <a href="https://coffeebede.com/mehdineox" target="_blank" rel="noopener">یک قهوه برام بخر</a>
    </nav>
  </main>
</body>
</html>
